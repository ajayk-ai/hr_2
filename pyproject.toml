[project]
name = "hr-2"
version = "0.1.0"
description = "Classifies, renames and packages candidate onboarding documents (Document AI + Gemini)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "filetype>=1.2.0",
    "google-cloud-documentai>=3.15.0",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # import sorting
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "ASYNC",        # async correctness
    "S",            # bandit
]
ignore = [
    "S101",  # assert is used for invariants and throughout the tests
    "E501",  # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded tokens in auth tests

[tool.mypy]
python_version = "3.14"
packages = ["app"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["filetype.*", "google.*", "langchain_google_genai.*"]
ignore_missing_imports = true
